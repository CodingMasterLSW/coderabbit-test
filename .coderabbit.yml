language : "ko-KR"

reviews :
  profile : "chill"
  # PR/MR 설명에 변경 사항에 대한 높은 수준의 요약을 생성합니다.
  # 기본값: true
  high_level_summary : true

  # 자동 리뷰 설정
  auto_review :
    # 자동 코드 리뷰를 활성화합니다.
    # 기본값: true
    enabled : true

    # 드래프트 PR/MR을 리뷰합니다.
    # 기본값: false
    drafts : false
# =============================================================================
# KNOWLEDGE BASE
# 지식 기반 설정입니다.
# =============================================================================
knowledge_base :
  # 코드 래빗이 조직의 코드 가이드라인을 분석하고 학습하도록 활성화합니다.
  # 이 가이드라인은 철저한 코드 리뷰를 수행하는 데 사용됩니다.
  code_guidelines :
    # 조직의 코딩 표준을 리뷰 중에 CodeRabbit이 적용하도록 활성화합니다.
    # 기본값: true
    enabled : true

    # 코딩 가이드라인 문서를 지정하는 파일 패턴입니다.
    # CodeRabbit은 이 파일을 스캔하여 팀의 표준을 이해하고 코드 리뷰에 적용합니다.
    # 여러 파일이 지원됩니다. 파일 이름은 대소문자를 구분합니다.
    # 일반적인 파일들(예: .github/copilot-instructions.md)은 기본적으로 포함됩니다 [8].
    filePatterns :
      - "./docs/team_conventions.md"   # 예시: 팀의 코딩 컨벤션 문서
